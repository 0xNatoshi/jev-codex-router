name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jev:
    name: Jev server (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: macos-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Byte-compile all Python sources
        run: python -m compileall -q server poc
      - name: Unit tests
        run: python -m unittest discover -s server -p "test_*.py" -v

  embedded-router:
    name: Embedded router (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: router
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: router/package-lock.json
      - run: npm ci
      - name: Install Chromium for the required browser-panel lane
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  codex-contract:
    name: Codex app-server contract (0.155.0-alpha.9.2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: router
    env:
      CODEX_ROUTER_REQUIRE_REAL_CODEX: "1"
      CODEX_ROUTER_EXPECT_CODEX_VERSION: codex-cli 0.155.0-alpha.9.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: router/package-lock.json
      - run: npm ci
      - name: Install the pinned Codex CLI contract
        run: npm install --global @openai/codex@0.155.0-alpha.9.2
      - name: Verify the real app-server integration cannot skip
        run: node --test --test-timeout=600000 test/login-free-app-server.test.mjs

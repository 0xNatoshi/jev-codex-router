# Workflow for the tap repository (duolahypercho/homebrew-codex-router), not for
# this one. Copy it there as .github/workflows/ci.yml when the tap is created.
#
# The tap ships no bottles, so every user builds from source. That makes this the
# only place a broken formula is caught before someone runs `brew install`.
name: CI

"on":
  push:
    branches: [main]
  pull_request:
  # The release workflow in duolahypercho/codex-router pushes a formula bump here,
  # and a scheduled run catches the case where an upstream dependency (node@24,
  # python@3.12) moved underneath a formula nobody has touched.
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formula:
    strategy:
      fail-fast: false
      matrix:
        # Both are supported: the router registers a launchd agent on macOS and a
        # systemd unit on Linux. A formula that only builds on one is half a tap.
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: Homebrew/actions/setup-homebrew@master
      - run: brew style .
      - run: brew audit --strict --formula ./Formula/codex-router.rb
      # Building from source is the whole point: `brew install` alone would pour a
      # bottle on a tap that had one, and would never exercise the venv build.
      - run: brew install --build-from-source --verbose ./Formula/codex-router.rb
      - run: brew test --verbose ./Formula/codex-router.rb
      # `brew linkage` is what catches a keg whose compiled extensions point at
      # libraries that were only present on the build machine.
      - run: brew linkage --test codex-router
      # setup is interactive and registers a background service, so it is never
      # run here. `doctor` is the closest non-mutating check: it must run and
      # report, rather than crash on a path that only exists in a checkout.
      - name: Diagnose without configuring
        run: codex-router doctor --json || true
      - run: brew uninstall codex-router
